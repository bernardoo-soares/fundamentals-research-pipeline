[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamentals-pipeline"
version = "0.2.0"
description = "S&P 500 fundamentals research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "simfin>=1.0",
]

[project.scripts]
fundamentals-pipeline = "fundamentals_pipeline.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0",
]
# The research console. Optional so the pipeline still installs and runs
# headless without a UI stack; `pip install -e .[ui]` adds it.
#
# Why these two, against the dependency policy's "existing stack first" test:
# the platform spec's D2 already chose Streamlit, and there is no way to serve
# an interactive local viewer from the standard library without writing a web
# framework. Altair ships as Streamlit's own charting dependency, so it adds
# nothing that is not already installed, and it renders a null as a gap rather
# than as zero -- which is a correctness requirement here, not a preference.
ui = [
  "streamlit>=1.40",
  "altair>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Declarative config files are loaded at runtime (the scorecard ramps/weights,
# the SEC metric mapping), so they must ship with the package rather than only
# resolving under an editable install.
[tool.setuptools.package-data]
fundamentals_pipeline = ["**/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
